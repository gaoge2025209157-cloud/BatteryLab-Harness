[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "electrochem-harness-v2"
version = "1.0.0"
description = "Auditable local electrochemistry research workflow"
requires-python = ">=3.10"
dependencies = [
  "openai-codex==0.167.0",
  "PyMuPDF==1.28.2",
]

[tool.unittest]
start-directory = "tests"

[tool.setuptools.packages.find]
where = ["src"]
